<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de Escritos — ETENNyA</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/tom-select@2.4.1/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.4.1/dist/js/tom-select.complete.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@7.8.2/build/index.js"></script>
<style>
  :root { --navy:#1a2744; --gold:#c9a84c; --cream:#f5f0e8; }
  body { font-family:'Outfit',sans-serif; background:var(--cream); }
  h1,h2,h3 { font-family:'Playfair Display',serif; }

  .ts-wrapper.single .ts-control { border:2px solid #d1c9bb; border-radius:0.5rem; padding:0.6rem 0.85rem; font-size:0.95rem; background:#fff; min-height:2.8rem; }
  .ts-wrapper.single.focus .ts-control { border-color:var(--navy); box-shadow:0 0 0 3px rgba(26,39,68,.12); }
  .ts-dropdown { border:2px solid var(--navy); border-radius:0.5rem; font-size:0.9rem; z-index:9999; position:absolute; }
  .ts-wrapper { position:relative; z-index:100; }
  .ts-dropdown .ts-dropdown-content .option.active { background:var(--navy); color:#fff; }
  .ts-dropdown .ts-dropdown-content .option:hover { background:#e8e2d8; }

  .campo-auto  { background:#eef2f9; border:1.5px solid #b8c5e0; }
  .campo-manual{ background:#fff;    border:1.5px solid #d1c9bb; }
  .campo-auto:focus, .campo-manual:focus { outline:none; border-color:var(--navy); box-shadow:0 0 0 3px rgba(26,39,68,.1); }

  .badge-auto   { background:#dde6f7; color:#1a2744; font-size:.65rem; font-weight:600; padding:.1rem .4rem; border-radius:.25rem; text-transform:uppercase; letter-spacing:.04em; }
  .badge-manual { background:#fef3cd; color:#7a5c00; font-size:.65rem; font-weight:600; padding:.1rem .4rem; border-radius:.25rem; text-transform:uppercase; letter-spacing:.04em; }

  .doc-check { accent-color:var(--navy); width:1.1rem; height:1.1rem; cursor:pointer; flex-shrink:0; }

  .cat-header { font-size:.7rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--navy); padding:.3rem .6rem; background:#dde6f7; border-radius:.4rem; display:inline-block; margin-bottom:.6rem; }
  .cat-block  { border-left:3px solid var(--navy); padding-left:1rem; margin-bottom:1.4rem; }

  .badge-default { background:#d4edda; color:#155724; font-size:.65rem; font-weight:700; padding:.1rem .5rem; border-radius:.25rem; margin-left:.4rem; }
</style>
</head>
<body class="min-h-screen py-8 px-4">

<!-- HEADER -->
<div class="max-w-4xl mx-auto mb-8">
  <div class="rounded-2xl p-6 text-white" style="background:var(--navy)">
    <h1 class="text-2xl font-semibold">Generador de Escritos</h1>
    <p class="text-sm mt-1 opacity-75">ETENNyA · Consejo de los Derechos de Niñas, Niños y Adolescentes</p>
  </div>
</div>

<div class="max-w-4xl mx-auto space-y-6">

  <!-- PASO 1 -->
  <div class="bg-white rounded-2xl shadow-sm p-6">
    <div class="flex items-center gap-2 mb-4">
      <span class="w-7 h-7 rounded-full text-white text-sm font-bold flex items-center justify-center" style="background:var(--navy)">1</span>
      <h2 class="text-lg font-semibold" style="color:var(--navy)">Seleccionar caso</h2>
    </div>
    <select id="caso-select" placeholder="Buscar por apellido, carátula o expediente..."></select>
  </div>

  <!-- PASO 2 -->
  <div class="bg-white rounded-2xl shadow-sm p-6">
    <div class="flex items-center gap-2 mb-5">
      <span class="w-7 h-7 rounded-full text-white text-sm font-bold flex items-center justify-center" style="background:var(--navy)">2</span>
      <h2 class="text-lg font-semibold" style="color:var(--navy)">Datos del caso</h2>
    </div>

    <!-- Auto -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5">
      <div>
        <label class="block text-xs font-semibold text-gray-500 mb-1 flex items-center gap-1">Nombre del joven <span class="badge-auto">Auto</span></label>
        <input id="f-nombre" class="campo-auto w-full rounded-lg px-3 py-2 text-sm" type="text" placeholder="Se completa al seleccionar caso">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-500 mb-1 flex items-center gap-1">DNI <span class="badge-auto">Auto</span></label>
        <input id="f-dni" class="campo-auto w-full rounded-lg px-3 py-2 text-sm" type="text">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-500 mb-1 flex items-center gap-1">Juzgado <span class="badge-auto">Auto</span></label>
        <input id="f-juzgado" class="campo-auto w-full rounded-lg px-3 py-2 text-sm" type="text">
        <input id="f-juzgado-nro" type="hidden">
        <input id="f-genero" type="hidden" value="M">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-500 mb-1 flex items-center gap-1">Expediente N° <span class="badge-auto">Auto</span></label>
        <input id="f-expediente" class="campo-auto w-full rounded-lg px-3 py-2 text-sm" type="text">
      </div>
      <div class="md:col-span-2">
        <label class="block text-xs font-semibold text-gray-500 mb-1 flex items-center gap-1">Carátula <span class="badge-auto">Auto</span></label>
        <input id="f-caratula" class="campo-auto w-full rounded-lg px-3 py-2 text-sm" type="text">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-500 mb-1 flex items-center gap-1">Fecha de nacimiento <span class="badge-auto">Auto</span></label>
        <input id="f-fecha-nac" class="campo-auto w-full rounded-lg px-3 py-2 text-sm" type="text">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-500 mb-1 flex items-center gap-1">Edad <span class="badge-auto">Auto</span></label>
        <input id="f-edad" class="campo-auto w-full rounded-lg px-3 py-2 text-sm" type="text">
      </div>
    </div>

    <hr class="border-gray-200 my-5">
    <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-4">Completar según documentos a generar</p>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Para SAME / División Infancia -->
      <div>
        <label class="block text-xs font-semibold text-gray-500 mb-1 flex items-center gap-1">Domicilio del operativo <span class="badge-manual">Manual</span></label>
        <input id="f-domicilio" class="campo-manual w-full rounded-lg px-3 py-2 text-sm" type="text" placeholder="Dirección para traslado (SAME / División)">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-500 mb-1 flex items-center gap-1">Hospital destino (traslado) <span class="badge-manual">Manual</span></label>
        <input id="f-hosp-destino" class="campo-manual w-full rounded-lg px-3 py-2 text-sm" type="text" placeholder="Para Oficio SAME y División Infancia">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-500 mb-1 flex items-center gap-1">Fecha del operativo <span class="badge-manual">Manual</span></label>
        <input id="f-fecha-op" class="campo-manual w-full rounded-lg px-3 py-2 text-sm" type="text" placeholder="Ej: 27 de mayo del corriente">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-500 mb-1 flex items-center gap-1">Hora del operativo <span class="badge-manual">Manual</span></label>
        <input id="f-hora-op" class="campo-manual w-full rounded-lg px-3 py-2 text-sm" type="text" placeholder="Ej: 9.30">
      </div>
      <!-- Para Hospital / Acompañante / Nota de Ejecución -->
      <div>
        <label class="block text-xs font-semibold text-gray-500 mb-1 flex items-center gap-1">Hospital de internación actual <span class="badge-manual">Manual</span></label>
        <input id="f-hosp-intern" class="campo-manual w-full rounded-lg px-3 py-2 text-sm" type="text" placeholder="Para Oficio Hospital, Acompañante, Nota Ejecución">
      </div>
      <!-- Para Nota de Ejecución -->
      <div>
        <label class="block text-xs font-semibold text-gray-500 mb-1 flex items-center gap-1">Hospital inicial (si hubo traslado) <span class="badge-manual">Manual</span></label>
        <input id="f-hosp-inicial" class="campo-manual w-full rounded-lg px-3 py-2 text-sm" type="text" placeholder="Solo si el joven fue transferido luego (Nota Ejecución)">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-500 mb-1 flex items-center gap-1">Fecha de ejecución de la medida <span class="badge-manual">Manual</span></label>
        <input id="f-fecha-ejec" class="campo-manual w-full rounded-lg px-3 py-2 text-sm" type="text" placeholder="Ej: 05/05/26 (para Nota de Ejecución)">
      </div>
    </div>

    <!-- Hechos para Medidas Precautorias -->
    <div class="mt-4">
      <label class="block text-xs font-semibold text-gray-500 mb-1 flex items-center gap-1">
        Relato de hechos <span class="badge-manual">Manual</span>
        <span class="text-gray-400 font-normal">— para Medidas Precautorias</span>
      </label>
      <textarea id="f-hechos" class="campo-manual w-full rounded-lg px-3 py-2 text-sm" rows="7" placeholder="Relatar los hechos que dan lugar a la solicitud de medida precautoria de salud...&#10;&#10;Cada párrafo separado con una línea en blanco se generará como párrafo independiente en el documento."></textarea>
    </div>
  </div>

  <!-- PASO 3 -->
  <div class="bg-white rounded-2xl shadow-sm p-6">
    <div class="flex items-center gap-2 mb-5">
      <span class="w-7 h-7 rounded-full text-white text-sm font-bold flex items-center justify-center" style="background:var(--navy)">3</span>
      <h2 class="text-lg font-semibold" style="color:var(--navy)">Elegir documentos</h2>
    </div>

    <!-- Escritos Judiciales -->
    <div class="cat-block">
      <span class="cat-header">Escritos Judiciales</span>
      <div class="space-y-2">
        <label class="flex items-center gap-3 p-3 rounded-xl border border-gray-200 hover:bg-gray-50 cursor-pointer">
          <input type="checkbox" class="doc-check" id="chk-medida-pre" checked>
          <span class="text-sm font-medium text-gray-800">
            <strong>Medida Precautoria de Salud</strong> — Expediente pre-existente (Dodero)
            <span class="badge-default">Por defecto</span>
          </span>
        </label>
        <label class="flex items-center gap-3 p-3 rounded-xl border border-gray-200 hover:bg-gray-50 cursor-pointer">
          <input type="checkbox" class="doc-check" id="chk-medida-nueva">
          <span class="text-sm font-medium text-gray-800">
            <strong>Medida Precautoria de Salud</strong> — Expediente nuevo (Oates Coll)
          </span>
        </label>
      </div>
    </div>

    <!-- Notas -->
    <div class="cat-block">
      <span class="cat-header">Notas</span>
      <div class="space-y-2">
        <label class="flex items-center gap-3 p-3 rounded-xl border border-gray-200 hover:bg-gray-50 cursor-pointer">
          <input type="checkbox" class="doc-check" id="chk-nota-ejec">
          <span class="text-sm font-medium text-gray-800">
            <strong>Nota de Ejecución de Medida de Salud</strong> (Dodero)
          </span>
        </label>
      </div>
    </div>

    <!-- Oficios Administrativos -->
    <div class="cat-block">
      <span class="cat-header">Oficios Administrativos</span>
      <div class="space-y-2">
        <label class="flex items-center gap-3 p-3 rounded-xl border border-gray-200 hover:bg-gray-50 cursor-pointer">
          <input type="checkbox" class="doc-check" id="chk-same">
          <span class="text-sm font-medium text-gray-800">Oficio al <strong>SAME</strong></span>
        </label>
        <label class="flex items-center gap-3 p-3 rounded-xl border border-gray-200 hover:bg-gray-50 cursor-pointer">
          <input type="checkbox" class="doc-check" id="chk-div">
          <span class="text-sm font-medium text-gray-800">Oficio a la <strong>División de Infancia y Adolescencia</strong></span>
        </label>
        <label class="flex items-center gap-3 p-3 rounded-xl border border-gray-200 hover:bg-gray-50 cursor-pointer">
          <input type="checkbox" class="doc-check" id="chk-hosp">
          <span class="text-sm font-medium text-gray-800">Oficio a <strong>Hospital</strong> por ejecución de medida</span>
        </label>
        <label class="flex items-center gap-3 p-3 rounded-xl border border-gray-200 hover:bg-gray-50 cursor-pointer">
          <input type="checkbox" class="doc-check" id="chk-acomp">
          <span class="text-sm font-medium text-gray-800"><strong>Pedido de Acompañante</strong> hospitalario</span>
        </label>
      </div>
    </div>

    <button id="btn-generar" onclick="generarDocumentos()"
      class="w-full py-3 px-6 rounded-xl text-white font-semibold text-sm transition-all hover:opacity-90 active:scale-95"
      style="background:var(--navy)">
      Generar documentos Word ↓
    </button>
    <div id="msg-generar" class="mt-3 text-sm text-center hidden"></div>
  </div>

</div><!-- /max-w -->

// ── HELPERS ──────────────────────────────────────────────────────────────
function nombreFormal(s) {
  const p = s.split(',');
  if (p.length < 2) return s;
  const aps = p[0].trim().split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
  return p[1].trim() + ' ' + aps;
}
function nombreCorto(s) {
  const p = s.split(',');
  return p.length > 1 ? p[1].trim() : s;
}
function fmtDNI(s) {
  const d = s.replace(/[.\s]/g, '');
  if (d.length === 8) return `${d.slice(0,2)}.${d.slice(2,5)}.${d.slice(5)}`;
  if (d.length === 7) return `${d.slice(0,1)}.${d.slice(1,4)}.${d.slice(4)}`;
  return s;
}
const EDADES = {'10':'diez','11':'once','12':'doce','13':'trece','14':'catorce','15':'quince','16':'dieciséis','17':'diecisiete','18':'dieciocho','19':'diecinueve','20':'veinte','21':'veintiún'};
function edadTexto(n) { return EDADES[String(n)] || String(n); }
function v(id) { return (document.getElementById(id).value || '').trim(); }
function mkG(genero) { return (m, f) => genero === 'F' ? f : m; }

// ── GENERADOR PRINCIPAL ───────────────────────────────────────────────────
async function generarDocumentos() {
  const { Document, Packer, Paragraph, TextRun, AlignmentType, UnderlineType } = window.docx;
  const msg = document.getElementById('msg-generar');
  const btn = document.getElementById('btn-generar');

  const d = {
    nombre:       v('f-nombre'),
    dni:          v('f-dni'),
    fecha_nac:    v('f-fecha-nac'),
    edad:         v('f-edad'),
    juzgado:      v('f-juzgado'),
    juzgado_nro:  v('f-juzgado-nro'),
    expediente:   v('f-expediente'),
    caratula:     v('f-caratula'),
    genero:       v('f-genero') || 'M',
    domicilio:    v('f-domicilio'),
    hosp_destino: v('f-hosp-destino'),
    hosp_intern:  v('f-hosp-intern'),
    hosp_inicial: v('f-hosp-inicial'),
    fecha_op:     v('f-fecha-op'),
    hora_op:      v('f-hora-op'),
    fecha_ejec:   v('f-fecha-ejec'),
    hechos:       document.getElementById('f-hechos').value.trim(),
  };

  if (!d.nombre) {
    showMsg('⚠ Primero seleccioná un caso.', 'red');
    return;
  }

  const checks = [
    [document.getElementById('chk-medida-pre').checked,  tplMedidaPreexistente, 'Medida_PreExistente'],
    [document.getElementById('chk-medida-nueva').checked, tplMedidaNueva,       'Medida_Nueva'],
    [document.getElementById('chk-nota-ejec').checked,   tplNotaEjecucion,      'Nota_Ejecucion'],
    [document.getElementById('chk-same').checked,        tplSAME,               'Oficio_SAME'],
    [document.getElementById('chk-div').checked,         tplDivision,           'Oficio_Division_Infancia'],
    [document.getElementById('chk-hosp').checked,        tplHospital,           'Oficio_Hospital'],
    [document.getElementById('chk-acomp').checked,       tplAcomp,              'Pedido_Acompanante'],
  ];

  const sel = checks.filter(c => c[0]);
  if (!sel.length) { showMsg('⚠ Seleccioná al menos un documento.', 'red'); return; }

  btn.disabled = true; btn.textContent = 'Generando...';
  msg.classList.add('hidden');

  const apellido = d.nombre.split(',')[0].trim().replace(/\s+/g,'_');

  for (const [, tplFn, nombre] of sel) {
    const children = tplFn(d, { Document, Paragraph, TextRun, AlignmentType, UnderlineType });
    const doc = new Document({
      sections:[{ properties:{ page:{ margin:{ top:1701, right:1701, bottom:1701, left:1701 } } }, children }]
    });
    const blob = await Packer.toBlob(doc);
    const url  = URL.createObjectURL(blob);
    const a    = Object.assign(document.createElement('a'), { href:url, download:`${nombre}_${apellido}.docx` });
    a.click(); URL.revokeObjectURL(url);
    await new Promise(r => setTimeout(r, 400));
  }

  btn.disabled = false; btn.textContent = 'Generar documentos Word ↓';
  showMsg(`✓ ${sel.length} documento(s) generado(s).`, 'green');
}

function showMsg(txt, color) {
  const el = document.getElementById('msg-generar');
  el.textContent = txt;
  el.className = `mt-3 text-sm text-center ${color === 'red' ? 'text-red-600' : 'text-green-700'}`;
  el.classList.remove('hidden');
}

// ── HELPERS DOCX ─────────────────────────────────────────────────────────
function mkP(runs, align, afterPt) {
  const { Paragraph, TextRun, AlignmentType } = window.docx;
  const spacing = { after: (afterPt ?? 8) * 20, line: 360 };
  if (typeof runs === 'string') runs = [{ text: runs }];
  return new Paragraph({
    children: runs.map(r => new TextRun({ font:'Times New Roman', size:24, ...r })),
    alignment: align ?? AlignmentType.JUSTIFIED,
    spacing
  });
}
function C(txt, extra) { return { text: txt, ...(extra||{}) }; }
function B(txt)  { return C(txt, { bold:true }); }
function U(txt)  { return C(txt, { underline:{} }); }
function BU(txt) { return C(txt, { bold:true, underline:{} }); }
function sp()    { const {AlignmentType} = window.docx; return mkP([C('')], AlignmentType.LEFT, 2); }

function textToParas(text) {
  if (!text) return [mkP('[COMPLETAR HECHOS]')];
  const paras = [];
  for (const line of text.split('\n')) {
    paras.push(line.trim() ? mkP(line.trim()) : sp());
  }
  return paras;
}

    mkP(`Debido al estado de alta vulnerabilidad en el que transita su cotidianidad, la problemática de consumo de sustancias psicoactivas que presentaría, sumado a la aparición de indicadores penales, puede afirmarse, conforme a la Ley Nacional de Salud Mental 26.657, una situación de riesgo cierto e inminente para sí mismo. Se considera necesario que, en forma inmediata y urgente, ${nc} pueda ser ${g('ingresado','ingresada')} a un efector del Sistema de Salud, desde donde pueda llevarse adelante un abordaje integral, en un marco de cuidados y contención profesional, que pueda proponer una línea tratamental que se ajuste a sus necesidades específicas.`),
    sp(),
    mkP('La evaluación integral implica la realización de una historia médica completa, sin descuidar ningún antecedente personal ni familiar, hábitos psicobiológicos, y otros. Por otra parte, se deberá incluir un examen físico lo más completo posible, bajo la perspectiva de que para que la situación del adolescente sea correctamente abordada se requiere una evaluación exhaustiva y que pueda sostenerse en el tiempo.'),

    mkP('La evaluación debe conducir a la formulación de impresiones diagnósticas que permitan orientar el abordaje de la situación y la implementación de un tratamiento acorde y posible en el contexto del paciente. En todo caso, los médicos deben actuar coordinadamente en el manejo de un paciente que requiera la atención de diversos especialistas, sin perder la perspectiva de que se trata de un individuo particular.'),
    sp(),
    mkP(`En virtud de los fundamentos expuestos y atendiendo al interés superior ${g('del adolescente','de la adolescente')} de autos, es que por medio de la presente se viene a solicitar se disponga la Medida de Salud respecto de ${nf} para que, una vez sea ${g('habido','habida')}, sea ${g('trasladado','trasladada')} al Hospital que corresponda, para llevar a cabo una evaluación integral de su salud psicofísica, ordenando su internación y permanencia hasta tanto cuente con el alta tanto médica como social, autorizada por parte de este CDNNyA, con el acompañamiento permanente de una consigna policial que por territorio corresponda.`),
    sp(),
    mkP([B('IV.- INFORMATIVA.')], AlignmentType.LEFT, 8),
    sp(),
    mkP('En miras a desplegar las acciones y medidas aquí detalladas solicitamos a la judicatura se libren oficios a los diferentes efectores que a continuación se detallan a fin de que se dé cumplimiento a lo solicitado por este Organismo en los términos expresados:'),

    mkP(`1. Se ordene su búsqueda de paradero: A tal fin, se solicita se libre la búsqueda de paradero de ${nc}. En virtud de lo mismo, se solicita se libren los oficios necesarios a los actores avocados a esta labor, puntualmente: Al Registro Nacional de Información de Personas Menores Extraviadas y a Missing Children; División de Infancia y Adolescencia de la Policía de la Ciudad de Buenos Aires; Policía Federal Argentina; Sistema Federal de Búsqueda de Personas Desaparecidas y Extraviadas (SIFEBU) del Ministerio de Seguridad de la Nación, así como también cualquier otro actor que la judicatura estime corresponder.`),
    sp(),
    mkP(`2. Seccional Policial de la Zona en la cual se encuentre ${g('internado','internada')} ${g('el adolescente','la adolescente')} al momento de la ejecución de las medidas: a fin de que dispongan consigna policial respecto ${g('del adolescente','de la adolescente')}, que vele por su seguridad y asegure la permanencia ${g('del mismo','de la misma')} en el Hospital de la zona hasta tanto cuente con el alta clínica y social, y sea ${g('acompañado','acompañada')} por el CDNNyA a un dispositivo acorde a su problemática o se efectivice la modalidad de egreso que oportunamente se evalúe como la acertada. Asimismo, se prohíba que ${g('el adolescente','la adolescente')} se retire del hospital con familiares y/o referentes afectivos, debiendo poner en conocimiento del CDNNyA la presencia de cualquier integrante de la familia que se haga presente.`),
    sp(),
    mkP(`3. Hospital interviniente: a fin de proceder a la atención integral de la salud ${g('del adolescente','de la adolescente')} y su evaluación por un equipo interdisciplinario, debiendo dar cumplimiento con la Ley de Salud Mental 26.657 y conforme lo dispuesto por el art. 42 del CCCN. Dicha evaluación deberá integrar: • Informe clínico integral • Informe toxicológico • Diagnóstico cardiológico • Diagnóstico por imágenes • Informe psicológico y psiquiátrico integral que dé cuenta de si el niño presenta riesgo para sí o para terceros • Amplio informe social. Asimismo, se deberá aclarar en el oficio que, previo a la alta médica, el hospital tendrá que remitir al Juzgado y al Consejo de los Derechos de Niñas, Niños y Adolescentes las evaluaciones interdisciplinarias solicitadas y copia de todos los estudios efectuados. Se prohíba el egreso hospitalario de ${nc} hasta tanto se realice la evaluación completa ${g('del mismo','de la misma')} y así lo disponga el Consejo de los Derechos de Niñas, Niños y Adolescentes y/o el Juzgado interviniente.`),

    mkP([B('V.- PETITORIO.')], AlignmentType.LEFT, 8),
    mkP('Por lo expuesto solicito:'),
    sp(),
    mkP('1. Se tenga por presentada la medida en legal tiempo y forma, de conformidad con la legitimación denunciada;'),
    mkP('2. Se haga lugar a las medidas solicitadas en su forma y extensión.'),
    mkP(`3. Se disponga la búsqueda de paradero conforme lo expuesto en el acápite correspondiente. Se prohíba el egreso hospitalario ${g('del adolescente','de la adolescente')} y se mantenga la permanencia ${g('del mismo','de la misma')} en el efector de salud hasta tanto se culmine con la evaluación integral y así lo disponga el Consejo de los Derechos de Niñas, Niños y Adolescentes y/o la judicatura.`),

// ── TEMPLATE: NOTA DE EJECUCIÓN DE MEDIDA DE SALUD (Dodero) ─────────────
function tplNotaEjecucion(d, lib) {
  const {AlignmentType} = lib;
  const nf = nombreFormal(d.nombre);
  const g = mkG(d.genero);
  const fechaEjec = d.fecha_ejec || '[FECHA DE EJECUCIÓN]';
  const hi  = d.hosp_intern || '[HOSPITAL DE INTERNACIÓN]';
  const hi0 = d.hosp_inicial;

  const movimiento = hi0
    ? `quien ingresó primeramente al ${hi0}, para luego ser ${g('trasladado','trasladada')} al ${hi}, en donde se encuentra ${g('internado','internada')} en la actualidad.`
    : `quien fue ${g('trasladado','trasladada')} al ${hi}, en donde se encuentra ${g('internado','internada')} en la actualidad.`;

  return [
    mkP([BU('INFORMA.')], AlignmentType.LEFT, 8),
    sp(),
    mkP([C('Señor Juez:')], AlignmentType.LEFT, 8),
    sp(),
    mkP(doderoCaption(d)),
    sp(),
    mkP(`Es objeto de esta pieza anoticiar a la judicatura que, en fecha ${fechaEjec}, tuvo lugar la ejecución de la Medida de Salud Precautoria dictada en autos en favor de ${nf}, ${movimiento}`),
    sp(),
    mkP('Tenga V.S. presente lo expuesto y provea de conformidad, lo que'),
    sp(),
    mkP([U('SERA JUSTICIA')], AlignmentType.RIGHT, 8),
  ];
}
